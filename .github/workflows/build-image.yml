# Construit l'image et la pousse sur GHCR. Le VPS la tire ensuite tout seul
# (agent autodeploy, verification toutes les 2 min), donc ce workflow ne
# pretend jamais avoir deploye : il garantit seulement qu'une image est publiee.
# Le verdict de prod appartient a la machine qui sert l'app.
#
# Genere depuis lab-infra/ci/build-dockerfile.yml — ne pas editer a la main,
# relancer ./scripts/install-ci.sh <app>.
name: build foldready

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # le nom du workflow porte l'app (le depot weave en heberge deux, api et web) :
  # avec un groupe commun elles s'annulaient l'une l'autre
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/guillaume-flambard/foldready:latest
            ghcr.io/guillaume-flambard/foldready:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max