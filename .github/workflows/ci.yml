name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift build + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test

  web:
    name: Web build (Next.js export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
