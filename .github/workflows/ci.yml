name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift build + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test
      - name: Sourcing (every check cites Apple)
        run: python3 Scripts/sourcing-check.py
      - name: Result contract (golden)
        run: python3 Scripts/contract-golden.py

  dogfood:
    name: Dogfood the action on the contract fixture
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: FoldReady
        id: foldready
        uses: ./
        with:
          path: Tests/Fixtures/ContractApp
          name: ContractApp
          # The fixture is deliberately unready: report, never fail this repo's own CI.
          fail-on-breach: "false"
          comment-on-pr: "false"
      - name: The action reports a score and, on a pull request, a delta
        run: |
          echo "score=${{ steps.foldready.outputs.score }} grade=${{ steps.foldready.outputs.grade }}"
          echo "base=${{ steps.foldready.outputs.base-score }} delta=${{ steps.foldready.outputs.delta }}"
          test -n "${{ steps.foldready.outputs.score }}"
          # The delta only exists on a pull request whose base carries the audited path.
          # Dogfooding is worth nothing if the job cannot say whether it was measured.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "${{ steps.foldready.outputs.base-score }}" ]; then
            echo "::warning::no base score was measured for this pull request"
          fi

  web:
    name: Web build (Next.js export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
